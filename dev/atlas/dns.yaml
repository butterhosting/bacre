service: dns
home: /srv/demo/services/dns

btrfs:
  schedule: "5 * * * *"
  subvolume: /srv/demo/disk-a/@dns
  snapshots: /srv/demo/disk-a/.snapshots
  targets:
    - /srv/demo/disk-b/.snapshots
  retention:
    preserveMin: 24h
    preserve: [72h, 30d]
  lifecycle:
    stop: docker compose down
    start: docker compose up --wait

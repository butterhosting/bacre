# No lifecycle block: this one can only be snapshotted hot, and not restored.
# No schedule either: it is only backed up by hand.
service: radio
home: /srv/demo/services/radio

btrfs:
  subvolume: /srv/demo/disk-a/@radio
  snapshots: /srv/demo/disk-a/.snapshots
  targets:
    - /srv/demo/disk-b/.snapshots
  retention:
    preserveMin: 24h
    preserve: [72h, 30d]

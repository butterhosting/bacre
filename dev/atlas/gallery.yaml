service: gallery
home: /srv/demo/services/gallery

btrfs:
  schedule: "5 * * * *"
  subvolume: /srv/demo/disk-a/@gallery
  snapshots: /srv/demo/disk-a/.snapshots
  targets:
    - /srv/demo/disk-b/.snapshots
  retention:
    preserveMin: 24h
    preserve: [72h, 30d]
  lifecycle:
    stop: docker compose down
    start: docker compose up --wait

restic:
  schedule: "0 3 * * *"
  repository: s3:s3.example.com/demo-backups/gallery
  envset: demo-s3
  retention:
    keepLast: 3
    keepDaily: 30
    keepWeekly: 15
    keepMonthly: 12
  backupPaths:
    - /srv/demo/disk-a/@gallery/data
    - /srv/demo/dumps/gallery
  lifecycle:
    backupPrepare: |
      docker compose stop main
      docker compose exec -T postgres sh -c \
        'pg_dump --clean --if-exists --username="$POSTGRES_USER" "$POSTGRES_DB" > /dumps/gallery.sql'
    backupRelease: |
      docker compose up --wait
      rm -rf /srv/demo/dumps/gallery/*
    restoreApply: |
      docker compose stop main
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/disk-a/@gallery/data/" \
        /srv/demo/disk-a/@gallery/data/
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/dumps/gallery/" \
        /srv/demo/dumps/gallery/
      docker compose exec -T postgres sh -c \
        'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" < /dumps/gallery.sql'
      docker compose up --wait

service: mailbox
home: /srv/demo/services/mailbox

btrfs:
  schedule: "5 * * * *"
  subvolume: /srv/demo/disk-a/@mailbox
  snapshots: /srv/demo/disk-a/.snapshots
  targets:
    - /srv/demo/disk-b/.snapshots
  retention:
    preserveMin: 24h
    preserve: [72h, 30d]
  lifecycle:
    stop: docker compose down
    start: docker compose up --wait

restic:
  schedule: "0 3 * * *"
  repository: s3:s3.example.com/demo-backups/mailbox
  envset: demo-s3
  retention:
    keepLast: 3
    keepDaily: 30
    keepWeekly: 15
    keepMonthly: 12
  backupPaths:
    - /srv/demo/disk-a/@mailbox/data
    - /srv/demo/dumps/mailbox
  lifecycle:
    # No database: stopping the app is all it takes for a consistent copy
    backupPrepare: |
      docker compose stop main
    backupRelease: |
      docker compose up --wait
    restoreApply: |
      docker compose down
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/disk-a/@mailbox/data/" \
        /srv/demo/disk-a/@mailbox/data/
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/dumps/mailbox/" \
        /srv/demo/dumps/mailbox/
      docker compose up --wait

service: ledger
home: /srv/demo/services/ledger

btrfs:
  schedule: "5 * * * *"
  subvolume: /srv/demo/disk-a/@ledger
  snapshots: /srv/demo/disk-a/.snapshots
  targets:
    - /srv/demo/disk-b/.snapshots
  retention:
    preserveMin: 24h
    preserve: [72h, 30d]
  lifecycle:
    stop: docker compose down
    start: docker compose up --wait

restic:
  schedule: "0 3 * * *"
  repository: s3:s3.example.com/demo-backups/ledger
  envset: demo-s3
  retention:
    keepLast: 3
    keepDaily: 30
    keepWeekly: 15
    keepMonthly: 12
  backupPaths:
    - /srv/demo/disk-a/@ledger/data
    - /srv/demo/dumps/ledger
  lifecycle:
    backupPrepare: |
      docker compose exec -T mariadb sh -c \
        'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-dump --user=root --single-transaction ledger > /dumps/ledger.sql'
    backupRelease: |
      rm -rf /srv/demo/dumps/ledger/*
    restoreApply: |
      docker compose stop main
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/disk-a/@ledger/data/" \
        /srv/demo/disk-a/@ledger/data/
      rsync -a --delete \
        "$BACRE_STAGING/srv/demo/dumps/ledger/" \
        /srv/demo/dumps/ledger/
      docker compose exec -T mariadb sh -c \
        'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb --user=root ledger < /dumps/ledger.sql'
      docker compose up --wait

# `just dev`: the fake shell answers for btrfs, btrbk, restic and bash, so none of the
# services or secrets below have to exist. kim:possible can log in; empty `users` turns auth off.
# Paths are relative to this file, and everything the dev stage writes stays in gitignored
# directories beside it.
stage: dev
server:
  bind: 127.0.0.1
  port: 3001
services:
  - atlas/*.yaml
users:
  - kim:$2y$05$O6pLpHgLgQV1PSlzzLGGNuMp205RBZyqfdHO0XGoJ4EmeTL9ZaReO
envsets:
  demo-s3:
    RESTIC_PASSWORD: dev
    AWS_ACCESS_KEY_ID: dev
    AWS_SECRET_ACCESS_KEY: dev
# webhook:
#   url: http://127.0.0.1:9000/hooks/bacre
#   secret: dev
tmpDir: .tmp
backends:
  restic:
    cacheDir: .cache
    stagingDir: .staging

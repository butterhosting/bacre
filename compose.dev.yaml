name: bacre-dev

services:
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    command: bun run dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      BACRE_WEBSITE_HOST: 0.0.0.0
      BACRE_BACKEND: http://bacre:3001
    ports:
      - "3000:3000"
    volumes:
      - ./website:/app
      # the container's own node_modules, not the host's
      - /app/node_modules
    stop_grace_period: 100ms

  bacre:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # umask 0: what one user builds into the volumes, the next one (another HOST_UID) can build over
    command: sh -c 'umask 0000 && exec cargo watch --quiet --watch src --watch Cargo.toml --watch build.rs --exec "run -- config.dev.yaml"'
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - cargo-target:/cargo-target
      - cargo-registry:/usr/local/cargo/registry
      - ./fake/btrfs.sh:/usr/local/bin/btrfs:ro
      - ./fake/findmnt.sh:/usr/local/bin/findmnt:ro
      # schedules and snapshot names are in local time
      - /etc/localtime:/etc/localtime:ro
    stop_grace_period: 100ms

volumes:
  cargo-target:
  cargo-registry:


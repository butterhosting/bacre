# `just dev`: the website and the Rust server, each in its own container, both following your edits

services:
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    command: bun run dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      BACRE_WEBSITE_HOST: 0.0.0.0
      BACRE_BACKEND: http://bacre:3001
    ports:
      - "3000:3000"
    volumes:
      - ./website:/app
      # the container's own install, not the host's
      - /app/node_modules
    networks:
      - app-network
    stop_grace_period: 100ms

  bacre:
    build:
      context: ./docker/bacre-dev
    # umask 0: what one user builds into the volumes, the next one (another HOST_UID) can build over
    command: sh -c 'umask 0000 && exec cargo watch --quiet --watch src --watch Cargo.toml --watch build.rs --exec "run -- config.dev.yaml"'
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      # Linux build output and crate downloads, kept between runs and apart from the host's own
      - cargo-target:/cargo-target
      - cargo-registry:/usr/local/cargo/registry
      # the host's clock zone: schedules are written in local time, and so are snapshot names
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network
    stop_grace_period: 100ms

volumes:
  cargo-target:
  cargo-registry:

networks:
  app-network:
    driver: bridge

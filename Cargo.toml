[package]
name = "bacre"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
croner = { version = "4.0.1", features = ["chrono"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
glob = "0.3.4"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

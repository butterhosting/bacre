[package]
name = "bacre"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
